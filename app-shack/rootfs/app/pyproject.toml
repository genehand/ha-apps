[project]
name = "app-shack"
version = "0.16.1"
description = "Home Assistant compatibility layer for running integrations outside of HA"
requires-python = ">=3.14.2"
dependencies = [
    # Upstream Home Assistant, used as a library. The modules HA keeps free of
    # its model layer (const, exceptions, util.*, helpers.typing,
    # helpers.deprecation, generated.*) are imported verbatim instead of being
    # reimplemented under shim/. Pin exactly: that surface is internal API and
    # moves every release, so the version *is* the contract. Bump deliberately
    # (edit the pin, uv lock, run the suite), never float it.
    "homeassistant==2026.10.4",
    # HA Shim core dependencies
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "colorlog>=6.8.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
    "probatio>=0.12.0",
    "pyjwt>=2.8.0",
    "yarl>=1.9.0",
    "python-multipart>=0.0.6",
    "cryptography>=42.0.0",
    # HACS integration dependencies
    "aiogithubapi>=22.10.1",
    "awesomeversion>=22.9.0",
    # Workaround for FlightRadarAPI
    "beautifulsoup4",
    # Release notes rendering
    "markdown>=3.6",
    "packaging>=24.0",
    # homeassistant.components.zeroconf stub (shim/stubs/components.py). Declared
    # here because the stub is built during import patching, before integration
    # requirements (e.g. libdyson-neon) are installed into /data/.venv.
    "zeroconf>=0.147.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "FlightRadarAPI==1.4.0",
    "pycountry==24.6.1",
    "httpx>=0.28.1",
    # tests/test_nest_protect_platform_attr.py imports the integration's
    # generated protobuf modules, which import google.protobuf at module scope.
    "protobuf>=5.0",
    "googleapis-common-protos>=1.76",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests that require external dependencies (deselect with '-m \"not integration\"')",
]
