slug: app-soloist
name: Soloist
version: 0.4.0
url: https://github.com/genehand/ha-apps/blob/main/app-soloist/README.md

init: false

description: Spotify playback device with MQTT discovery for Home Assistant

arch:
  - aarch64
  - amd64

startup: services

boot: auto

# Soloist advertises itself on the local network as a Spotify Connect device,
# so it must share the host network to be discoverable from Spotify apps.
host_network: true

services:
  - mqtt:want

options:
  device_name: "Soloist"
  soloist_api_key: ""
  initial_volume: 100
  pipewire_device: ""
  cache_size_mb: 0
  pair: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  device_name: str
  soloist_api_key: password
  initial_volume: "int(0,100)?"
  # Only applies if soloist ends up using PipeWire; empty = system default.
  pipewire_device: str?
  # Volatile playback cache cap in MB: 0 = no limit, otherwise at least 100.
  cache_size_mb: "int(0,100000)?"
  # Run soloist in pair mode once at bridge start (replace the stored session).
  pair: bool?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(trace|debug|info|warn|error)?
