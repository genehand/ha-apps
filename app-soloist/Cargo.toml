[package]
name = "soloist-bridge"
version = "0.3.1"
edition = "2021"
authors = ["Gene Hand"]
description = "Home Assistant bridge for Spotify Soloist (WebSocket API -> MQTT discovery)"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Spotify Soloist WebSocket client
tokio-tungstenite = "0.30"

# MQTT
rumqttc = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

# Error handling
anyhow = "1"

# Unix signals (graceful SIGTERM to the soloist daemon on shutdown)
libc = "0.2"

# Configuration
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
